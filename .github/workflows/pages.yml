name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MDBOOK_VERSION: 0.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir mdbook-bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C mdbook-bin
          echo "$(pwd)/mdbook-bin" >> "$GITHUB_PATH"
      - name: Build book
        run: mdbook build site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/book
      - id: deployment
        uses: actions/deploy-pages@v4
